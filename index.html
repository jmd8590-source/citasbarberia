<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>
    // Runs before first paint: avoids a flash of the wrong theme/language
    // for returning visitors (the full i18n/theme system boots once js/app.js loads).
    (function () {
        try {
            var theme = localStorage.getItem('bb_theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
            var lang = localStorage.getItem('bb_lang');
            if (!lang) lang = (navigator.language || 'es').toLowerCase().indexOf('en') === 0 ? 'en' : 'es';
            document.documentElement.setAttribute('lang', lang);
            window.__bbLoadingText = lang === 'en' ? 'Loading BarberClub...' : 'Cargando BarberClub...';
        } catch (e) { /* localStorage unavailable (private mode, etc.) — safe to ignore */ }
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="BarberClub — Reserva tu cita en la mejor barbería. Estilo, precisión y actitud. Cortes de cabello, arreglo de barba y más.">
    <meta name="theme-color" content="#FAF8F4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Security & Protection Meta Tags -->
    <!-- frame-ancestors can't be enforced via <meta>; it is set as a real HTTP header at deploy time (see vercel.json) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cloud.appwrite.io https://*.appwrite.network; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

    <title>BarberClub — Reserva tu cita</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>
    <!-- App Mount Point -->
    <div id="app">
        <!-- Loading state while JS loads -->
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem;">
            <div class="loading-spinner" style="width: 40px; height: 40px; border-width: 3px;"></div>
            <p style="color: #A89F95; font-family: 'Inter', sans-serif; font-size: 0.875rem;" id="bootLoadingText">Cargando BarberClub...</p>
        </div>
    </div>
    <script>
        if (window.__bbLoadingText) {
            var el = document.getElementById('bootLoadingText');
            if (el) el.textContent = window.__bbLoadingText;
        }
    </script>

    <!-- Scripts (ES module graph: app.js imports everything it needs) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
